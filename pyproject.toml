[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Fourier-HELIX"
version = "1.0.0"
description = "Fourier-based HELIX architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/Fourier-HELIX"

[tool.setuptools]
packages = ["fourier_helix"]
